name: FactoryGuard offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Unit and adversarial tests
        run: pytest
      - name: Offline evaluation and critical regression gate
        run: |
          factoryguard evaluate --output results/ci.json
          factoryguard compare results/offline-baseline.json results/ci.json
      - name: Retain machine-readable evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factoryguard-evaluation
          path: results/ci.json
          if-no-files-found: warn
